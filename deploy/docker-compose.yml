services:
  db:
    image: postgres:16-alpine
    container_name: fluxo_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - fluxo_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: ghcr.io/huzefa897/fluxo-backend:${APP_VERSION}
    container_name: fluxo_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATASOURCE_USER: ${POSTGRES_USER}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 8080
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/huzefa897/fluxo-frontend:${APP_VERSION}
    container_name: fluxo_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    restart: unless-stopped

volumes:
  fluxo_pgdata:
